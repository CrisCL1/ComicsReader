name: Build unsigned IPA

# El proyecto vive en la subcarpeta Onyx/, pero GitHub SOLO detecta workflows
# en .github/workflows/ situado en la RAIZ del repositorio. Por eso este
# archivo va en la raiz y entra en Onyx/ para trabajar.

on:
  workflow_dispatch:
  push:
    branches: [main]

defaults:
  run:
    working-directory: Onyx

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar proyecto Xcode
        run: xcodegen generate

      - name: Compilar (sin firma)
        run: |
          set -o pipefail
          xcodebuild \
            -project Onyx.xcodeproj \
            -scheme Onyx \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      - name: Empaquetar .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Onyx.app Payload/
          zip -qry Onyx-unsigned.ipa Payload
          ls -lh Onyx-unsigned.ipa

      # upload-artifact NO respeta defaults.run: la ruta va desde la raiz.
      - name: Publicar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Onyx-unsigned-ipa
          path: Onyx/Onyx-unsigned.ipa
          retention-days: 30
